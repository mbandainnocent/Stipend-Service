spring:
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: stipend-service-registration-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "com.stipend.service.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.stipend.service.event.StudentRegisteredEvent"

app:
  kafka:
    topics:
      registration: registration-events