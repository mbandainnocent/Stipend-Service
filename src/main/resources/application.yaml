
spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Producers (e.g. the attendance service) add a __TypeId__ header naming their
        # own classes. Ignore it and bind to each listener's local default type instead.
        spring.json.trusted.packages: com.stipend.service.Event
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false

    listener:
      ack-mode: record

app:
  jwt:
    # Must equal the attendance service's app.jwt.secret (APP_JWT_SECRET), which
    # issues the access tokens. The default is for local development only.
    secret: ${APP_JWT_SECRET:change-this-to-a-long-secure-secret-key-at-least-32-bytes}

  security:
    # Roles (without the ROLE_ prefix) allowed to read stipends and approve/pay them.
    finance-roles: ${APP_SECURITY_FINANCE_ROLES:ADMIN,FINANCE}

    cors:
      # Comma-separated browser origins allowed to call the API, e.g.
      # https://finance.igirerwanda.org,http://localhost:3000. Empty = CORS disabled.
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

  kafka:
    topics:
      registration: student-registration-events
      student-status: student-status-events
      attendance: attendance-events

    consumer-groups:
      registration: stipend-service-registration-group
      attendance: stipend-service-attendance-group
      student-status: stipend-service-student-status-group

    retry:
      interval-ms: 1000
      max-retries: 2

  registration:
    business-time-zone: Africa/Kigali

  stipend:
    calculation:
      cron: "0 0 2 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
