

# Application configuration
server.port=8080
spring.application.name=stipend-service

# PostgreSQL connection. Compose exposes the host database on port 5538.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5538/stipenddb}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:stipend_app}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:password}}

# Schema updates are convenient for local development; use a migration-managed schema in production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
