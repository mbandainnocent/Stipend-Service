# Server Configuration
server.port=8080

# Application Name
spring.application.name=stipend-service

# Application configuration
server.port=8080
spring.application.name=stipend-service

# PostgreSQL connection. Set DB_URL, DB_USERNAME, and DB_PASSWORD for your environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stipenddb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema updates are convenient for local development; use a migration-managed schema in production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
